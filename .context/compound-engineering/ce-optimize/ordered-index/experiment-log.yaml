#     change: "..."
#     commit_before: <sha>
#     commit_after: <sha>
#     measurements:                   # one per T or config variant
#       - { t: 4, n: 1000000, slot_reads_per_query: X, correctness: true, insert_writes: Y, range_p50_ns: Z }
#     best_measurement: { t: ..., slot_reads_per_query: ... }
#     verdict: keep | revert
#     delta_vs_best: -X%
#     reasoning: "..."

strategy_digest: |
  Current best: e2 = 28.93 (T=5, narrow wire widths).
  Lever 1 (DONE e1): compact Node codec — lifted T from 2 to 4, depth 13→7, slot_reads 102.84→39.04 (-62.04%).
  Lever 2 (DONE e2): wire-format width narrowing — child mirror 20B→9B + entry/header length fields u16→u8 unlocks T=5 (T=6 overflows 416B with 10-char bench keys). Slot reads 39.04→28.93 (-25.9%). Gap to PG bar shrunk from 12.04 to 1.93 reads/q.
  Lever 3 (NEXT): B+tree leaf-linking — range walks leaves directly via sibling pointers; further cuts leaf-walk overhead from O(depth × leaves) to O(leaves). Predicted -6 to -8 reads/q.
  Lever 4: cursor pagination.
  T=6 does NOT fit with 10-char keys; if the workload switches to ≤8-char keys, e2 would also enable T=6 (max 397B) and the depth win would be larger.
