[package]
name = "pvm_contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime library for PVM smart contracts"

[dependencies]
pvm-contract-macros = { path = "../pvm-contract-macros" }
alloy-primitives = { version = "0.8", default-features = false }
ethereum-types = { version = "0.14", default-features = false, features = ["codec"] }
pallet-revive-uapi = { version = "0.9", default-features = false }
parity-scale-codec = { version = "3.6", default-features = false }
polkavm-derive.workspace = true
tiny-keccak = { workspace = true }
const_format = { workspace = true }
